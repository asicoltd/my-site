<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Asif Hasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a0c10, #1a1f2c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
        .thank-you-card {
            background: rgba(33, 37, 41, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(13, 110, 253, 0.3);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(13, 110, 253, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            border: 2px solid #0d6efd;
        }
        .success-icon i {
            font-size: 40px;
            color: #0d6efd;
        }
        h1 {
            color: white;
            margin-bottom: 1rem;
        }
        p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
        }
        .btn-home {
            background: linear-gradient(135deg, #0d6efd, #20c997);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(13,110,253,0.3);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="thank-you-card" data-aos="fade-up">
                    <div class="success-icon">
                        <i class="fas fa-check"></i>
                    </div>
                    <h1>Thank You!</h1>
                    <p>Your message has been sent successfully. I'll get back to you within 24-48 hours.</p>
                    <a href="https://asif.info.bd" class="btn-home">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
